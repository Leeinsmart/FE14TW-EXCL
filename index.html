<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>Formula E 贊助類別清單（中譯）</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1a1d23;--sub:#5b6270;--mute:#8a909b;--line:#dfe2e7;--acc:#23395b;--acc2:#e8edf4;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--ink:#e9ebef;--sub:#aab1bd;--mute:#7d8592;--line:#2c323b;--acc:#9fb6d9;--acc2:#222a35;--err:#ff8a7a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
#lock{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.lockbox{width:100%;max-width:380px}
.lockbox h1{font-size:22px;line-height:1.4;margin:0 0 18px}
.lockbox form{display:flex;gap:10px}
.lockbox input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:16px;padding:12px 14px;border-radius:8px;outline:none}
.lockbox input:focus{border-color:var(--acc)}
.lockbox button{background:var(--acc);color:var(--bg);border:0;font-size:15px;font-weight:700;padding:0 20px;border-radius:8px;cursor:pointer}
.lockbox button[disabled]{opacity:.6}
.err{color:var(--err);margin:12px 0 0;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#app{max-width:960px;margin:0 auto;padding:0 16px 48px}
.top{padding:28px 0 8px}
.top h1{font-size:clamp(22px,5.6vw,30px);line-height:1.35;margin:0 0 8px}
.src{color:var(--sub);font-size:13.5px;margin:0 0 14px}
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:13px;color:var(--acc);background:var(--acc2);text-decoration:none;padding:5px 10px;border-radius:999px}
.sbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sbar input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);outline:none}
.sbar input:focus{border-color:var(--acc)}
.qn{font-size:13px;color:var(--sub);white-space:nowrap}
.part{margin-top:28px}
.ptitle{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--acc);border-top:3px solid var(--acc);padding-top:8px}
.sec{padding:10px 0 18px;scroll-margin-top:70px}
.sec h2{font-size:clamp(19px,4.8vw,24px);line-height:1.4;margin:6px 0 6px}
.sec h2 .num{color:var(--acc)}
.lead{color:var(--sub);font-size:14.5px;margin:0 0 14px}
.note{color:var(--mute);font-size:12.5px;margin:10px 0 0}
.en{color:var(--mute);font-size:12px;font-weight:400;line-height:1.4}
.colhead{display:none}
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.row h3{font-size:16.5px;margin:0;line-height:1.4}
.row .c1{margin-bottom:8px}
.row .c2{font-size:15px;margin-bottom:6px}
.row .c2 b{font-weight:700}
.lbl{display:inline-block;font-size:12px;color:var(--acc);background:var(--acc2);border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:1px}
.row .c3{margin:0;font-size:14.5px;color:var(--ink)}
@media(min-width:720px){
 .colhead{display:grid;grid-template-columns:24% 20% 1fr;gap:16px;font-size:12.5px;font-weight:700;color:var(--acc);padding:0 16px 6px}
 .row{display:grid;grid-template-columns:24% 20% 1fr;gap:16px;align-items:start}
 .row .c1,.row .c2{margin:0}
 .row .lbl{display:none}
}
.blk2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.blk2{grid-template-columns:1fr 1fr}}
.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.bh{font-size:16.5px;margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.sub{margin-top:12px}
.sub h4{font-size:14px;margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:13.5px;background:var(--acc2);border-radius:6px;padding:3px 9px}
.list{margin:0;padding:0 0 0 18px}
.list li{font-size:14.5px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:880px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:16px;margin:0}
.olist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.olist li{font-size:13.5px;background:var(--acc2);border-radius:6px;padding:3px 9px}
.hide{display:none!important}
.nw{white-space:nowrap}
.empty{color:var(--sub);padding:24px 0;text-align:center}
</style>
</head>

  <div class="lockbox">
    <h1>Formula E 贊助類別清單（中譯）</h1>
    <form id="f" autocomplete="off">

      <button id="go" type="submit">解鎖</button>
    </form>
    <p id="err" class="err" role="alert" hidden></p>
  </div>
</div>

function sha256(msg){var l=msg.length,padLen=((l+9+63)>>6)<<6,m=new Uint8Array(padLen);m.set(msg);m[l]=0x80;var dv=new DataView(m.buffer);dv.setUint32(padLen-8,Math.floor(l/0x20000000));dv.setUint32(padLen-4,(l<<3)>>>0);
  var h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=new Uint32Array(64),i;
  for(var off=0;off<padLen;off+=64){for(i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){var x=w[i-15],y=w[i-2];w[i]=(w[i-16]+((rotr(x,7)^rotr(x,18)^(x>>>3))>>>0)+w[i-7]+((rotr(y,17)^rotr(y,19)^(y>>>10))>>>0))>>>0;}
    var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];

    h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;}

    for(var i=1;i<iter;i++){u=prf(u);for(var j=0;j<32;j++)t[j]^=u[j];}out.set(t,(bi-1)*32);}return out.slice(0,dkLen);}
async function deriveMaster(pw,salt,iter){var force=/[?&]purejs=1/.test(location.search);
  if(!force&&window.crypto&&crypto.subtle&&crypto.subtle.importKey){try{var km=await crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,512);return new Uint8Array(bits);}catch(e){}}
  return pbkdf2(pw,salt,iter,64);}
async function unlock(p){var pw=new TextEncoder().encode(p),salt=b64(P.salt),iv=b64(P.iv),ct=b64(P.ct),tag=b64(P.tag);
  var mk=await deriveMaster(pw,salt,P.iter),ek=mk.slice(0,32),mac=hmacFn(mk.slice(32));
  var m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);var t=mac(m),ok=t.length===tag.length;for(var i=0;i<t.length;i++)ok=ok&&(t[i]===tag[i]);
  if(!ok)return 'wrong';

  app.innerHTML=new TextDecoder().decode(pt);lock.hidden=true;app.hidden=false;window.scrollTo(0,0);hit();boot();return 'ok';}
function hit(){try{var h=location.hostname;if(location.protocol==='file:'||h==='localhost'||h==='127.0.0.1'||h==='')return;
  var K='mv_device_id',i=localStorage.getItem(K);if(!i){i=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);localStorage.setItem(K,i);}
  var u=EP+'/hit?p='+KEY+'&d='+encodeURIComponent(i);if(navigator.sendBeacon){navigator.sendBeacon(u);}else{fetch(u,{mode:'no-cors',keepalive:true});}}catch(e){}}
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();}
function boot(){
  var q=document.getElementById('q'),qn=document.getElementById('qn');
  var items=[].slice.call(app.querySelectorAll('.it'));
  items.forEach(function(el){el._h=norm(el.textContent+' '+(el.getAttribute('data-s')||''));});
  function run(){var k=norm(q.value),n=0;
    items.forEach(function(el){var ok=!k||el._h.indexOf(k)>=0;el.classList.toggle('hide',!ok);if(ok)n++;});
    [].slice.call(app.querySelectorAll('[data-grp]')).reverse().forEach(function(g){g.classList.toggle('hide',!!k&&!g.querySelector('.it:not(.hide)'));});
    app.querySelectorAll('[data-sec]').forEach(function(s){s.classList.toggle('hide',!!k&&!s.querySelector('.it:not(.hide)'));});
    app.querySelectorAll('[data-part]').forEach(function(p){p.classList.toggle('hide',!!k&&!p.querySelector('.it:not(.hide)'));});
    qn.textContent=k?(n?qn.getAttribute('data-count').replace('{n}',n):qn.getAttribute('data-none')):'';}
  q.addEventListener('input',run);
}
form.addEventListener('submit',async function(ev){ev.preventDefault();var p=(pw.value||'').normalize('NFC').trim();if(!p)return;
